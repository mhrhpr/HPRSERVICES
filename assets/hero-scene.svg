<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="t d">
<title id="t">خدمات فنی حسین پور؛ لوله کشی آب و فاضلاب</title>
<desc id="d">نمای گرافیکی یک متخصص تأسیسات در حال کار کنار سینک و شبکه لوله‌های آب و فاضلاب با رنگ‌های سرمه‌ای، قرمز و نارنجی.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1d31"/><stop offset=".55" stop-color="#173a5b"/><stop offset="1" stop-color="#0d2238"/></linearGradient>
  <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#315a82"/><stop offset="1" stop-color="#102942"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f6"/><stop offset="1" stop-color="#a7b1bc"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#06101d" flood-opacity=".28"/></filter>
</defs>
<rect width="960" height="620" rx="30" fill="url(#bg)"/>
<g opacity=".08" stroke="#fff"><path d="M0 70h960M0 130h960M0 190h960M0 250h960M0 310h960M0 370h960M0 430h960M0 490h960M0 550h960"/><path d="M70 0v620M130 0v620M190 0v620M250 0v620M310 0v620M370 0v620M430 0v620M490 0v620M550 0v620M610 0v620M670 0v620M730 0v620M790 0v620M850 0v620M910 0v620"/></g>
<text x="48" y="62" fill="#fff" font-family="Inter,Arial" font-size="13" font-weight="800" letter-spacing="3">HOSSEINPOUR SERVICES</text>
<text x="48" y="93" fill="#ff9b4a" font-family="Vazirmatn,Arial" font-size="20" font-weight="800">آب · فاضلاب · بازسازی</text>

